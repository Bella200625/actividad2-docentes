spring.application.name=docentes-api

# Puerto: Render lo entrega en la variable PORT. En tu computador usa 8080.
server.port=${PORT:8080}

# Base de datos:
# - En tu computador (sin configurar nada) usa H2, una base de datos en memoria para pruebas.
# - En Render se configuran DB_URL, DB_USER y DB_PASSWORD con los datos de Neon (PostgreSQL).
spring.datasource.url=${DB_URL:jdbc:h2:mem:docentes;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Crea o actualiza las tablas automáticamente a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
